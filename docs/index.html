<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>환동퀀트</title>
<style>
:root{--bg:#121a2b;--panel:#1a2338;--panel2:#222c46;--line:#2c3754;--fg:#e8ecf4;--mut:#8f9ab3;--acc:#f4c04e;--up:#ff5d5d;--dn:#4d8eff;--good:#3ecf8e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:20px;margin:0;font-weight:800;color:var(--acc);letter-spacing:-.5px}
#asof{font-size:12px;color:var(--mut);flex:1}
.ibtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 13px;border-radius:999px;background:var(--panel);color:var(--mut);font-size:14px;border:1px solid var(--line)}
.tab.on{background:var(--acc);color:#16181d;border-color:var(--acc);font-weight:700}
.filters{display:flex;gap:6px;flex-wrap:wrap}
select,input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px}
input{width:100%;font-size:15px;padding:10px}
.tgl{background:var(--panel);color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.tgl.on{background:#3a3215;color:var(--acc);border-color:var(--acc);font-weight:700}
main{padding:10px 12px 40px;max-width:760px;margin:0 auto}
.banner{background:#4a2d14;color:#ffd9a8;border-radius:10px;padding:9px 12px;margin:10px 12px 0;font-size:13px;max-width:736px}
.desc{color:var(--mut);font-size:13px;line-height:1.5;margin:2px 2px 10px}
.desc b{color:var(--fg)}
.sec{font-weight:700;margin:16px 2px 8px;color:var(--acc);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:block;width:100%;text-align:left}
.row1{display:flex;align-items:baseline;gap:8px}
.rk{color:var(--mut);font-size:13px;min-width:20px}
.nm{font-weight:700;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px{font-variant-numeric:tabular-nums;font-size:14px}
.chg{font-variant-numeric:tabular-nums;font-size:13px;min-width:56px;text-align:right}
.up{color:var(--up)}.dn{color:var(--dn)}
.sub{color:var(--mut);font-size:12px;margin:2px 0 6px 28px}
.mets{display:flex;gap:6px;flex-wrap:wrap;margin-left:28px}
.met{background:var(--panel2);border-radius:7px;padding:3px 7px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.met b{color:var(--fg);font-weight:600;margin-left:3px}
.chip{display:inline-block;border-radius:6px;padding:2px 7px;font-size:12px;margin:2px 4px 0 0;background:#3a3215;color:var(--acc)}
.chip.st{background:#1c2f4d;color:#9cc0ff}
.more{width:100%;padding:11px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:40px 10px;font-size:14px;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:500}
.small{font-size:11px;color:var(--mut)}
.scrollt{white-space:nowrap}.scrollt td:first-child,.scrollt th:first-child{position:sticky;left:0;background:var(--bg);z-index:1}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-radius:16px 16px 0 0;max-height:86vh;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-width:760px;margin:0 auto;border-top:1px solid var(--line)}
#sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.x{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;border:none;background:var(--panel2);font-size:18px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.cell{background:var(--panel2);border-radius:8px;padding:7px 8px}
.cell .k{font-size:11px;color:var(--mut)}
.cell .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--acc)}
.brow{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.brow span:first-child{width:52px;color:var(--mut)}
.brow span:last-child{width:30px;text-align:right;font-variant-numeric:tabular-nums}
.links{display:flex;gap:8px;margin-top:12px}
.links a{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--panel2);color:var(--fg);text-decoration:none;font-size:14px}
svg.spark{width:100%;height:90px;display:block}
svg.pfchart{width:100%;height:200px;display:block;margin-top:6px}
.pfbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.pff{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px;color:var(--mut)}
.pff span{flex:1}
.pff select,.pff input{width:auto;min-width:120px;max-width:58%;font-size:14px;padding:7px 8px}
.pfrow{display:flex;align-items:center;gap:8px;margin:6px 0}
.pfrow .nm{font-size:14px}
.pfw{width:64px!important;padding:6px!important;font-size:14px!important}
.pfhit{display:block;width:100%;text-align:left;padding:10px;margin:4px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:14px}
.pfsave{display:block;width:100%;margin:14px 0 4px;padding:12px;border-radius:10px;border:none;background:var(--acc);color:#16181d;font-weight:700;font-size:15px}
.pfta{width:100%;height:90px;margin:8px 0;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;font-size:12px;padding:8px}
.addpf{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--acc);background:none;color:var(--acc);font-weight:700;font-size:14px}
.good{color:var(--good)}
.chip.good{background:#173a2c;color:var(--good)}.chip.up{background:#4a1f24;color:#ff8a8a}
</style>
</head>
<body>
<header>
  <div class="top"><h1>환동퀀트</h1><span id="asof">불러오는 중…</span><button class="ibtn" id="info" aria-label="안내">?</button></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="filters" id="filters">
    <select id="fMkt"><option value="">전체 시장</option><option value="KOSPI">코스피</option><option value="KOSDAQ">코스닥</option></select>
    <select id="fCap"><option value="">시총 전체</option><option value="0-1000">소형 1천억 미만</option><option value="1000-5000">중소형 1천억~5천억</option><option value="5000-20000">중형 5천억~2조</option><option value="20000-">대형 2조 이상</option></select>
    <select id="fTv"><option value="0">거래대금 전체</option><option value="5">일 5억↑</option><option value="20">일 20억↑</option><option value="100">일 100억↑</option></select>
    <button type="button" class="tgl" id="fSig" aria-pressed="false">매수신호만</button>
  </div>
</header>
<div id="banner"></div>
<main id="list"></main>
<div id="veil"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><button class="x" id="close" aria-label="닫기">✕</button><div id="sheetBody"></div></div>

<script>
(function(){
"use strict";
var D=null,R=[],BY={},tab=location.hash==="#coin"?"coin":"total",shown=50,query="",sigOnly=false;
var $=function(s){return document.querySelector(s)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function nz(v){return v!==null&&v!==undefined}
function num(v,d){return nz(v)?Number(v).toLocaleString("ko-KR",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}):"–"}
var F={
  s:function(v){return nz(v)?Math.round(v)+"":"–"},
  p:function(v){return nz(v)?v.toFixed(1)+"%":"–"},

var TABS=[
 {k:"total",l:"종합",d:"<b>밸류·퀄리티·모멘텀</b> 백분위 점수의 평균(0~100). 세 가지 모두 계산되는 종목만.",f:function(r){return nz(r.total)},s:sortBy("total"),c:[["종합","total","s"],["밸류","v","s"],["퀄리티","q","s"],["모멘텀","m","s"]]},
 {k:"lmom",l:"대형 모멘텀",d:"코스피 <b>시총 상위 100</b> 중 12-1개월 수익률 순. 상위 10이 편입 대상. 백테스트: 11~4월 보유 시 20~23년 +10%/년, 23~26년 +37%/년.",f:function(r){return nz(r.lm)},s:sortBy("lm",true),rk:"lm",topN:10,c:[["12-1M","mom12","sp"],["6M","mom6","sp"],["52주고점","hi52","sp"],["시총","mcap","eok"]],season:true},
 {k:"lcombo",l:"대형 종합",d:"코스피 시총 상위 100 중 가치(PER·이익수익률)+질(ROA·ROE)+모멘텀(12-1·6-1개월) 평균 순. 상위 10 편입. 백테스트: 11~4월 보유 시 +9%/년, +36%/년.",f:function(r){return nz(r.lc)},s:sortBy("lc",true),rk:"lc",topN:10,c:[["PER","per","x"],["ROE","roe","p"],["12-1M","mom12","sp"],["시총","mcap","eok"]],season:true},
 {k:"lmf",l:"대형 마법공식",d:"코스피 시총 상위 100 중 이익수익률+ROA 순(흑자만). 상위 10 편입. 백테스트: 11~4월 보유 시 +5%/년, +25%/년 — 대형주에선 모멘텀보다 약함.",f:function(r){return nz(r.lf)},s:sortBy("lf",true),rk:"lf",topN:10,c:[["이익수익률","ey","p"],["ROA","roa","p"],["PER","per","x"],["시총","mcap","eok"]],season:true},
 {k:"size",l:"시총 상위",d:"코스피 시가총액 순. 상위 20 동일비중이 비교 기준. 백테스트: 11~4월 보유 시 +11%/년, +17%/년.",f:function(r){return nz(r.sz)},s:sortBy("sz",true),rk:"sz",topN:20,c:[["시총","mcap","eok"],["PER","per","x"],["12-1M","mom12","sp"],["종합","total","s"]],season:true},
 {k:"mf",l:"마법공식",d:"<b>이익수익률</b>(영업이익 ÷ (시총+부채총계)) 순위와 <b>자본수익률 ROC</b>(영업이익 ÷ 총자산) 순위의 합. 영업이익 적자 제외. 둘 다 근사식.",f:function(r){return nz(r.mf)},s:sortBy("mf",true),c:[["순위","mf","i"],["이익수익률","ey","p"],["ROC","roc","p"],["PER","per","x"]]},
 {k:"value",l:"밸류",d:"이익/시총·순자산/시총·매출/시총·이익수익률의 백분위 평균. 높을수록 싸다.",f:function(r){return nz(r.v)},s:sortBy("v"),c:[["점수","v","s"],["PER","per","x"],["PBR","pbr","x"],["PSR","psr","x"]]},
 {k:"quality",l:"퀄리티",d:"ROE·ROA·영업이익률이 높고 부채비율이 낮을수록 높은 점수.",f:function(r){return nz(r.q)},s:sortBy("q"),c:[["점수","q","s"],["ROE","roe","p"],["영업이익률","opm","p"],["부채비율","debt","p"]]},
 {k:"mom",l:"모멘텀",d:"12-1개월·6-1개월·3개월 수익률 백분위 평균. 최근 1개월은 단기 되돌림 때문에 뺀다.",f:function(r){return nz(r.m)},s:sortBy("m"),c:[["점수","m","s"],["12-1M","mom12","sp"],["6M","mom6","sp"],["52주고점","hi52","sp"]]},
 {k:"signal",l:"매수신호",d:"최근 3거래일 안에 생긴 <b>기술적 매수신호</b>(종가 기준): 20/60 골든크로스, RSI 30 상향돌파, 볼린저 하단 복귀, 스토캐스틱 침체권(20 미만) 골든, 52주 신고가, 거래량 급증(3배+, +3%↑).",f:function(r){return r.nsig>0},s:function(a,b){return (b.nsig-a.nsig)||sortBy("total")(a,b)},c:[["RSI","rsi","i"],["이격도","disp","x"],["종합","total","s"]],chips:true},
 {k:"surge",l:"급등후보",d:"거래량 급증·20일 고점 돌파·밴드 수축 후 확장·RSI 강세·당일 상승폭으로 매긴 점수. <b>참고용 — 검증 전</b>. 성과 탭에서 실제 결과를 확인하세요.",f:function(r){return r.surge>0},s:sortBy("surge"),c:[["점수","surge","i"],["거래량","vr","xv"],["RSI","rsi","i"],["20일평균거래대금","tv20","eok"]],chips:true},
 {k:"coin",l:"코인",custom:"coin"},
 {k:"pf",l:"내 포트폴리오",custom:"pf"},
 {k:"perf",l:"성과",custom:"perf"},
 {k:"bt",l:"백테스트",custom:"bt"},
 {k:"search",l:"검색",custom:"search"}
];

function rowCard(r,rank,t){
  var b=el("button","card");b.type="button";
  var a=el("div","row1");a.appendChild(el("span","rk",t.rk?r[t.rk]:rank));a.appendChild(el("span","nm",r.name));
  if(r.hold){a.appendChild(el("span","chip st","보유"))}
  if(t.topN){a.appendChild(el("span","chip "+(r[t.rk]<=t.topN?"":"st"),r[t.rk]<=t.topN?"편입":"후보"))}
  a.appendChild(el("span","px",num(r.close)));var c=el("span","chg "+cls(r.chg),nz(r.chg)?(r.chg>0?"+":"")+r.chg.toFixed(2)+"%":"–");a.appendChild(c);b.appendChild(a);
  b.appendChild(el("div","sub",r.code+" · "+(r.mkt==="KOSPI"?"코스피":"코스닥")+" · 시총 "+F.eok(r.mcap)+(r.fin?" · 재무 "+r.fin:"")));
  var m=el("div","mets");
  (t.c||[]).forEach(function(x){var s=el("span","met",x[0]);var v=el("b",x[2]==="sp"?cls(r[x[1]]):"",F[x[2]](r[x[1]]));s.appendChild(v);m.appendChild(s)});
  b.appendChild(m);
  if(r.sig||(t.chips&&r.st)){var cw=el("div","mets");(r.sig||"").split("|").filter(Boolean).forEach(function(s){cw.appendChild(el("span","chip",s))});if(t.chips)(r.st||"").split("|").filter(Boolean).forEach(function(s){cw.appendChild(el("span","chip st",s))});b.appendChild(cw)}

function filt(r){
  var mk=$("#fMkt").value,cr=$("#fCap").value.split("-"),tv=+$("#fTv").value,mc=r.mcap||0;
  var lo=cr[0]?+cr[0]:0,hi=cr[1]?+cr[1]:Infinity;
  return (!mk||r.mkt===mk)&&(!$("#fCap").value||(mc>=lo&&mc<hi))&&(!tv||(r.tv20||0)>=tv)&&(!sigOnly||r.nsig>0);

function render(){
  var L=$("#list");L.innerHTML="";var t=TABS.find(function(x){return x.k===tab});
  $("#filters").style.display=(t.custom==="perf"||t.custom==="bt"||t.custom==="pf"||t.custom==="coin")?"none":"flex";
  ["#fMkt","#fCap","#fTv"].forEach(function(s){$(s).style.display=t.custom==="aplan"?"none":""});
  var d=el("p","desc");d.innerHTML=t.d||"";if(t.d)L.appendChild(d);
  if(t.season&&D){var mo=+D.meta.asof.slice(5,7),on=(mo>=11||mo<=4);var bn=el("div","banner",on?"지금은 보유 구간(11~4월)입니다. 백테스트 기준: 11월 초 매수 → 2월 초 교체 → 5월 초 매도.":"지금은 쉬는 구간(5~10월)입니다. 백테스트 기준 11월 초에 매수합니다.");bn.style.margin="0 0 10px";L.appendChild(bn)}
  if(t.custom==="aplan")return renderA(L,t);
  if(t.custom==="pf")return window.PF?window.PF.render(L):L.appendChild(el("div","empty","불러오는 중…"));
  if(t.custom==="coin")return window.CO?window.CO.render(L):L.appendChild(el("div","empty","불러오는 중…"));
  if(t.custom==="perf")return renderPerf(L);
  if(t.custom==="bt")return renderBT(L);
  if(t.custom==="search")return renderSearch(L);
  var rows=R.filter(function(r){return t.f(r)&&filt(r)}).sort(t.s);
  L.appendChild(el("div","small",rows.length+"종목"));
  if(!rows.length){L.appendChild(el("div","empty","조건에 맞는 종목이 없습니다."));return}
  rows.slice(0,shown).forEach(function(r,i){L.appendChild(rowCard(r,i+1,t))});
  if(rows.length>shown){var m=el("button","more","더 보기 ("+(rows.length-shown)+")");m.onclick=function(){shown+=50;render()};L.appendChild(m)}
}
function renderA(L,t){
  [["amf","마법공식 (상위 "+D.meta.aplan.mf_n+" 편입)",D.meta.aplan.mf_n,[["EV/영업이익","evop","x"],["ROA","roa","p"],["PER","per","x"]]],
   ["asm","소형모멘텀 (상위 "+D.meta.aplan.mom_n+" 편입)",D.meta.aplan.mom_n,[["1년","r1y","sp"],["시총","mcap","eok"],["3M","mom3","sp"]]]].forEach(function(g){
    L.appendChild(el("div","sec",g[1]));
    var rows=R.filter(function(r){return nz(r[g[0]])&&(!sigOnly||r.nsig>0)}).sort(sortBy(g[0],true));
