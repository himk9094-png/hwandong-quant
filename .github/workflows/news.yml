name: news

# 매주 토요일 08:43(한국시간) 보유 종목 공시·뉴스 점검 → ntfy
on:
  schedule:
    - cron: "43 23 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 캐시 복원 (DART 회사코드)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: news-${{ github.run_id }}
          restore-keys: data-
      - name: 점검
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python -u -m pipeline.news
