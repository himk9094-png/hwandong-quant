name: ui

# 화면(docs)만 바뀌었을 때: 계산은 다시 하지 않고, 지금 올라가 있는 데이터로 화면만 새로 배포
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ui
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 현재 데이터 가져오기 (주식·코인)
        run: |
          mkdir -p docs/data
          curl -sf "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/data/latest.json" -o docs/data/latest.json
          curl -sf "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/coin.json" -o docs/coin.json || echo "코인 데이터 없음"
          curl -sf "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/coinhist.json" -o docs/coinhist.json || echo "코인 데이터 없음"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy        # 여러 작업이 동시에 배포하다 충돌하지 않게 한 줄로 세움
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
