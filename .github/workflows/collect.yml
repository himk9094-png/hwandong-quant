name: collect

# 소형주 전략 백테스트용 과거 데이터 모으기 (data 브랜치 store/에 쌓음).
# DART 하루 한도 때문에 매일 이어받는다. 다 모이면 이 예약은 할 일이 없어 1~2분 만에 끝난다.
on:
  schedule:
    - cron: "7 15 * * *"     # 한국시간 00:07 — DART는 한국 낮엔 느리고 밤엔 빠름, 하루 한도도 자정에 초기화
  workflow_dispatch:
    inputs:
      steps:
        description: "실행할 단계 (krx disc multi fin)"
        default: "krx multi fin disc"
      threads:
        description: "DART 동시 요청 수 (낮엔 1, 밤엔 2)"
        default: "2"

permissions:
  contents: write
  actions: write          # 소형주 탭 갱신 후 화면 배포(ui) 실행

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyarrow
      - name: 모으기
        env:
          FIN_Q: "0.30"          # 재무 API는 소형주만(실제 공시일 확보용). 나머지 종목은 DART 일괄 파일(bulk)이 채움
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          STEPS: ${{ github.event.inputs.steps || 'krx multi fin disc' }}
          DART_THREADS: ${{ github.event.inputs.threads || '2' }}
          DART_GAP: "0.1"
        run: |
          save() { (flock 9; cd store && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git add -A && { git diff --cached --quiet || { git commit -qm "data $1 $(date -u +%F)" && git push -q origin HEAD:data; }; }) 9>/tmp/git.lock; }
          ( while sleep 900; do save "progress $(date -u +%H:%M)"; done ) & BG=$!
          lim() { case $1 in multi) echo 1800;; krx) echo 1800;; krxhl) echo 9000;; disc) echo 2400;; fin) echo 12600;; *) echo 600;; esac; }   # 합계가 작업 제한(330분) 안에 들고 소형주 탭 갱신까지 끝나게
          for s in $STEPS; do n=${s%%:*}; a=""; [ "$n" != "$s" ] && a=${s#*:}; timeout --signal=INT $(lim $n) python -u -X faulthandler -m backtest.collect $n $a || echo "::warning::$s 단계 실패/시간초과"; save $n; done
          kill $BG 2>/dev/null || true
          python -m backtest.collect status
      - name: DART 일괄 파일 → bulk.parquet (서버가 새로 올린 게 있을 때만)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/dart-bulk" -q '.assets[]|"\(.id) \(.name)"' | sort -k2 > /tmp/assets.txt || exit 0
          [ -s /tmp/assets.txt ] || exit 0
          if cmp -s /tmp/assets.txt store/fin/bulk_assets.txt; then echo "새 파일 없음"; exit 0; fi
          mkdir -p /tmp/z
          while read -r id nm; do gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$id" > "/tmp/z/$nm"; done < /tmp/assets.txt
          python -u -m backtest.bulk --zips /tmp/z && cp /tmp/assets.txt store/fin/bulk_assets.txt
      - name: 저장 (data 브랜치)
        if: always()
        run: |
          cd store
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -qm "data $(date -u +%F)"; git push -q origin HEAD:data; }
      - name: 소형주 탭 갱신 (docs/smallcap.json) + 분기 리밸런싱 알림
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u -m backtest.smallcap_app || echo "::warning::팩터 탭 계산 실패"
          python -u -m backtest.tabperf || echo "::warning::탭 백테스트 계산 실패"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/smallcap.json docs/tabperf.json docs/tabperf_f.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "소형주 탭 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh workflow run ui.yml --ref main || echo "화면 배포는 다음 일일 작업 때"
