name: coin-reg

# 5분마다(GitHub 예약 최소 간격) 확인. GitHub 예약은 바쁘면 밀릴 수 있다 — 더 정확히 하려면 cron-job.org 같은 바깥 예약으로 workflow_dispatch 호출.
# 아래 둘 중 하나면 코인 작업(coin)을 바로 돌린다:
#   1) 앱에서 '알림 받기'를 켜고 끈 게 있음 (ntfy 등록 주제에 새 메시지)
#   2) 마지막 계산 뒤로 새 4시간봉이 마감됨 (01·05·09·13·17·21시 정각 + 3분)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 확인 후 코인 작업 실행
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          j=$(curl -sf "$base/coin.json?t=$(date +%s)") || { echo "coin.json 없음"; exit 0; }
          reg=$(echo "$j" | jq -r '.cfg.reg // empty'); last=$(echo "$j" | jq -r '.mine.t // 0')
          new=0
          [ -n "$reg" ] && new=$(curl -sf "https://ntfy.sh/$reg/json?poll=1&since=all" | jq -s "[.[]|select(.event==\"message\" and .time>$last)]|length")
          bar=$(echo "$j" | jq '[.state.ut4h[]?.t]|max // 0'); now=$(date +%s%3N)
          stale=$(( now > bar + 4*3600000 + 180000 ? 1 : 0 ))
          echo "새 등록 메시지: ${new:-0} · 새 4시간봉: $stale"
          if [ "${new:-0}" -gt 0 ] || [ "$stale" = 1 ]; then
            if gh run list -R "$GITHUB_REPOSITORY" -w coin.yml -L 5 --json status -q '.[].status' | grep -qE "queued|in_progress|waiting|requested|pending"; then echo "코인 작업 이미 도는 중"
            else gh workflow run coin.yml -R "$GITHUB_REPOSITORY" --ref main && echo "코인 작업 실행"; fi
          fi
