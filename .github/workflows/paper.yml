name: paper

# 모의투자(가상 60만 원): 토스 봇과 같은 규칙 — 슈퍼퀄리티 20 · 분기 교체 · +20% 익절 → 현금 대기
# 평일 08:50(한국시간) 전 거래일 시세로 체결을 따지고 ntfy로 알림. 상태 = docs/paper.json
on:
  schedule:
    - cron: "50 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyarrow
      - name: 모의투자
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python -u -m backtest.paper
      - name: 저장
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/paper.json
          git diff --cached --quiet && exit 0
          git commit -qm "모의투자 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
