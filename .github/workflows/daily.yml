name: daily

on:
  schedule:
    - cron: "37 23 * * 0-4"   # 한국시간 월~금 08:37 (KRX가 08:00에 전 거래일 데이터 갱신)
  workflow_dispatch:           # Actions 탭에서 수동 실행
  push:                        # 계산 코드가 바뀌면 바로 다시 계산(알림은 안 보냄)
    branches: [main]
    paths: ["pipeline/**", "config.json"]

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  gate:                        # 서버(hq)가 이미 제시간에 실행했으면 늦게 온 예약 실행은 건너뜀
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "${{ github.event_name }}" = schedule ]; then
            since=$(date -u -d '-150 min' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/daily.yml/runs" -f event=workflow_dispatch -f created=">=$since" -q .total_count 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then go=false; echo "서버가 이미 실행함 → 건너뜀"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 캐시 복원 (주가·재무)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: 계산
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u -m pipeline.main ${{ github.event_name != 'schedule' && '--no-telegram' || '' }}

      - name: 실패 알림 (ntfy)
        if: failure()
        run: python -m pipeline.ntfy "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: data-${{ github.run_id }}

      - name: 추천 기록 커밋 (성과 추적용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/picks.csv
          git commit -m "기록 $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

      - name: 코인 데이터 가져오기 (같이 배포해야 사라지지 않음)
        run: |
          curl -sf "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/coin.json" -o docs/coin.json || echo "코인 데이터 없음"
          curl -sf "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/coinhist.json" -o docs/coinhist.json || echo "코인 데이터 없음"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy        # 여러 작업이 동시에 배포하다 충돌하지 않게 한 줄로 세움
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
